<!doctype html>
<meta charset="utf-8">
<title>Wildbound artboard</title>
<style>body{margin:0;background:#222}canvas{display:block}</style>
<canvas id="c" width="1600" height="1200"></canvas>
<script type="module">
// Visual check of every drawable: node tools/shoot-art.mjs 'http://localhost:4174/tools/artboard.html?s=winter' out.png
import * as R from '../render.js';
import { PETS, ITEMS, SEASON_BY_ID, BOSSES } from '../data.js';
const c = document.getElementById('c').getContext('2d');
const season = SEASON_BY_ID[new URLSearchParams(location.search).get('s') || 'forest'];
R.drawGround(c, { x: 800, y: 600 }, 1600, 1200, 1, season);
let x = 90;
for (const [type, r] of [['tree', 90], ['rock', 58], ['bush', 40], ['gold', 48], ['cactus', 34], ['log', 44], ['big-gold', 100]]) {
  R.drawResource(c, { id: type + 'a', type, x: type === 'big-gold' ? x + 40 : x, y: 120, r }, season, 1); x += 215;
}
const held = ['hand', 'stone-axe', 'gold-katana', 'ruby-naginata', 'amethyst-cleavers', 'sapphire-labrys', 'gold-crossbow', 'stone-shield', 'appletor', 'cake'];
held.forEach((w, i) => R.drawPlayer(c, { x: 80 + i * 160, y: 320, angle: -.3, skin: i, held: w, r: 35, hat: ['none', 'leaf', 'crown', 'horns', 'beanie', 'flower', 'miner', 'tamer', 'knight', 'none'][i], actionAt: i % 2 ? .95 : -9 }, 1));
PETS.forEach((p, i) => R.drawAnimal(c, { id: p.id, species: p.id, x: 70 + (i % 12) * 130, y: 490 + Math.floor(i / 12) * 115, angle: 0, sleep: i % 5 === 0, stage: 1, r: 40, moving: true }, 1));
BOSSES.slice(0, 4).forEach((b, i) => R.drawBoss(c, { boss: b.id, x: 160 + i * 250, y: 900, angle: 0, r: 85 }, 1));
['wood-wall', 'gold-wall', 'stone-door', 'ruby-spike', 'big-spike', 'sapphire-windmill', 'bear-trap', 'boost-pad', 'heal-pad', 'gold-turret', 'fire-tower'].forEach((id, i) => {
  const it = ITEMS.find(x => x.id === id);
  R.drawStructure(c, { item: id, x: 1100 + (i % 4) * 120, y: 820 + Math.floor(i / 4) * 120, r: it.r, rot: 0 }, .5);
});
R.drawNameplate(c, 300, 1150, 'Andre', .7, '#7fd14a', '27');
R.drawFloater(c, { x: 450, y: 1150, vx: 0, at: 0, life: 1, text: '-14', color: '#ff5a4a' }, .1);
R.drawProjectile(c, { x: 520, y: 1150, vx: 1, vy: 0, kind: 'arrow' }, 0);
R.drawProjectile(c, { x: 580, y: 1150, vx: 1, vy: 0, kind: 'fireball' }, 0);
R.drawHazard(c, { x: 680, y: 1130, r: 60, at: 1.3 }, 1);
ITEMS.filter((it, i) => i % 3 === 0).slice(0, 36).forEach((it, i) => c.drawImage(R.itemIcon(it.id, 44), 760 + (i % 18) * 46, 1070 + Math.floor(i / 18) * 50));
window.done = true;
</script>
